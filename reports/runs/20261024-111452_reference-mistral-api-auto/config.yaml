name: reference-mistral-api-auto
seed: 0
output_root: /content/drive/MyDrive/voxtral-runs
model:
  family: mistral_api
  hf_id: voxtral-mini-transcribe-3
  tiny: false
  dtype: bfloat16
  transcription_delay_ms: 480
  language: null
  adapter: null
data:
  dataset_id: scribe-project/npsc_nb
  subset_dir: null
  download: true
  cache_dir: data/cache
  exclude_train_speakers_from:
  - test
runtime:
  device: cuda
  batch_size: 32
  max_new_tokens: 256
train:
  alignments: null
  extra_data: null
  selection_ids: subsets/selection/validation.txt
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_encoder: false
  augment: false
  learning_rate: 0.0001
  warmup_steps: 100
  epochs: 2
  batch_size: 16
  micro_batch_size: 8
  max_grad_norm: 1.0
  log_every: 20
  save_every: 250
  eval_every: 500

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voxnor"
version = "0.1.0"
description = "LoRA fine-tuning and evaluation of Voxtral speech-to-text models for Norwegian."
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
# Exact pins: every reported number must be reproducible with these versions.
# On Linux, the PyPI torch wheel ships with CUDA; on Windows it is CPU-only.
dependencies = [
    "torch==2.14.1",
    "transformers==5.20.1",
    "peft==0.21.2",
    "accelerate==1.15.0",
    "mistral-common[audio]==1.12.0",
    "datasets==5.1.0",
    "huggingface-hub==2.2.0",
    "pyarrow==26.0.0",
    "pandas==3.0.6",
    "numpy==2.3.5",
    "soundfile==0.14.0",
    "librosa==0.11.0",
    "scipy==1.17.1",
    "jiwer==4.0.0",
    "pyyaml==6.0.3",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1"]
# Figures in reports/ (scripts/analyse_finetune.py); not needed on the GPU machine.
analysis = ["matplotlib==3.11.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Word lists read better as one "a b c".split() string than as one item per line.
ignore = ["SIM905"]

[tool.ruff.lint.per-file-ignores]
# Colab cells hold long shell (`!`) commands that cannot be wrapped.
"notebooks/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
